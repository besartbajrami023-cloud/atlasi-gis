<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Katalogu i Layerave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f7f5;--panel:#fff;--ink:#1d2320;--muted:#66706b;--line:#dde2de;
  --accent:#1f6f5c;--accent-soft:#e3f1ec;--warn:#a2591a;--warn-soft:#fbeedd;--bad:#b23a3a;--bad-soft:#f8e3e3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816;--panel:#1c211f;--ink:#e6ebe8;--muted:#98a39d;--line:#2d3531;
  --accent:#5cc2a6;--accent-soft:#1f3630;--warn:#e0a060;--warn-soft:#3a2c1c;--bad:#ef7d7d;--bad-soft:#3d2222;}}
:root[data-theme="dark"]{
  --bg:#141816;--panel:#1c211f;--ink:#e6ebe8;--muted:#98a39d;--line:#2d3531;
  --accent:#5cc2a6;--accent-soft:#1f3630;--warn:#e0a060;--warn-soft:#3a2c1c;--bad:#ef7d7d;--bad-soft:#3d2222;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header,.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:20px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:20px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-all}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding-block:20px;max-width:1400px;margin:0 auto}
main{min-width:0}
.mbar{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding-block:16px 96px}
  aside{position:static}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;gap:10px;align-items:center;
    background:var(--panel);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar span{flex:1;font-weight:600}
  .mbar button{width:auto}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input[type=search]{flex:1;min-width:200px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;width:100%;padding:11px}
:root[data-theme="dark"] button.primary{color:#0d1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0d1a16}}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
summary{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft)}
.row input{margin-top:3px}
.t{font-weight:500;word-break:break-word}
.meta{color:var(--muted);font-size:12px}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.b.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
aside{position:sticky;top:16px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
aside h2{font-size:15px;margin:0 0 10px}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
aside select,aside textarea{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto}
.chip{background:var(--accent-soft);border-radius:12px;padding:3px 8px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip b{cursor:pointer;font-weight:400;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
.note{font-size:12px;padding:8px 10px;border-radius:6px;margin-top:10px;background:var(--warn-soft);color:var(--warn)}
.ok{font-size:12px;color:var(--accent);margin-top:8px;min-height:16px}
.out{width:100%;height:120px;font:12px/1.4 Consolas,monospace;margin-top:8px;display:none}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.radios input{display:none}
.radios input:checked+span{color:var(--accent);font-weight:600}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
</style>


<header>
  <h1>Katalogu i Layerave – Gllogoc / Drenas</h1>
  <div class="sub" id="sub"></div>
</header>
<div class="wrap">
  <main>
    <div class="tools">
      <input type="search" id="q" placeholder="Kërko layer (p.sh. rrug, liqen, HZK)…">
      <select id="ft">
        <option value="">Të gjitha llojet</option>
        <option value="Point">Pika</option>
        <option value="Line">Linja</option>
        <option value="Polygon">Poligone</option>
        <option value="raster">Rasterë</option>
      </select>
      <button id="hap">Hapi të gjitha</button>
      <button id="pastro">Hiq zgjedhjet</button>
    </div>
    <div id="lista"></div>
  </main>
  <aside id="zgjedhja">
    <h2>Zgjedhja ime (<span id="cnt">0</span>)</h2>
    <div class="chips" id="chips"></div>
    <label class="f">Çfarë do të bëjmë?</label>
    <div class="radios" id="detyra">
      <label><input type="radio" name="d" value="Hartë" checked><span>Hartë</span></label>
      <label><input type="radio" name="d" value="Analizë gjeohapësinore"><span>Analizë</span></label>
      <label><input type="radio" name="d" value="Hartë + analizë"><span>Të dyja</span></label>
    </div>
    <label class="f">Rezultati</label>
    <select id="rez">
      <option>Projekt QGIS (.qgz) + PNG</option>
      <option>Hartë PDF për printim (A3)</option>
      <option>Hartë PDF për printim (A4)</option>
      <option>Vetëm projekt QGIS (.qgz)</option>
      <option>Tabelë / statistika (Excel)</option>
      <option>Shtresë e re (shapefile / GeoPackage)</option>
    </select>
    <label class="f">Përshkrimi (çfarë të tregojë harta / pyetja e analizës)</label>
    <textarea id="pershk" rows="4" placeholder="p.sh. Cilat parcela komunale bien brenda brezit mbrojtës të rrugëve nacionale?"></textarea>
    <div id="paralajm"></div>
    <div style="margin-top:14px"><button class="primary" id="kopjo">Kopjo kërkesën për Claude</button></div>
    <div class="ok" id="ok"></div>
    <textarea class="out" id="out" readonly></textarea>
  </aside>
</div>
<div class="mbar">
  <span><span id="mcnt">0</span> layera të zgjedhur</span>
  <button id="mshko">Vazhdo ↓</button>
</div>

const KEY = "katalogu-gllogoc-zgjedhja";
let sel = new Set();
try { sel = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const byId = Object.fromEntries(K.layerat.map(l => [l.id, l]));
sel = new Set([...sel].filter(id => byId[id]));

document.getElementById("sub").textContent =
  `${K.numri} layera · përditësuar ${K.gjeneruar} · ${K.dosja}`;

const geomSq = g => /Point/i.test(g) ? "Pikë" : /Line/i.test(g) ? "Linjë" : /Polygon/i.test(g) ? "Poligon" : g;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...sel])); } catch(e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const ft = document.getElementById("ft").value;
  const open = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.t));
  const temat = {};
  for (const l of K.layerat) {
    const hay = (l.titulli + " " + l.fajlli + " " + l.tema).toLowerCase();
    if (q && !hay.includes(q)) continue;
    if (ft === "raster" ? l.lloji !== "raster" : ft && !(l.gjeometria || "").includes(ft)) continue;
    (temat[l.tema] ||= []).push(l);
  }
  const html = Object.keys(temat).sort().map(t => {
    const ls = temat[t].sort((a, b) => a.titulli.localeCompare(b.titulli, "sq"));
    const n = ls.filter(l => sel.has(l.id)).length;
    const rows = ls.map(l => {
      const badges = [];
      badges.push(`<span class="b">${esc(l.lloji === "raster" ? "Raster" : geomSq(l.gjeometria))}</span>`);
      if (l.objekte != null) badges.push(`<span class="b">${l.objekte} obj.</span>`);
      if (l.statusi === "pa .prj") badges.push(`<span class="b warn">pa .prj</span>`);
      if (l.statusi === "i dëmtuar") badges.push(`<span class="b bad">i dëmtuar</span>`);
      const crs = l.epsg ? `EPSG:${l.epsg}` : l.crs;
      return `<div class="row ${sel.has(l.id) ? "sel" : ""}" data-id="${esc(l.id)}">
        <input type="checkbox" ${sel.has(l.id) ? "checked" : ""} ${l.statusi === "i dëmtuar" ? "disabled" : ""}>
        <div><div class="t">${esc(l.titulli)}</div>
          <div class="meta">${esc(l.fajlli)} · ${esc(crs)}${l.shenim ? " · " + esc(l.shenim) : ""}</div></div>
        <div class="badges">${badges.join("")}</div></div>`;
    }).join("");
    return `<details data-t="${esc(t)}" ${open.has(t) || q || ft ? "open" : ""}>
      <summary><input type="checkbox" class="grp" ${n && n === ls.length ? "checked" : ""}> ${esc(t)}
      <span class="n">${n ? n + " / " : ""}${ls.length}</span></summary>${rows}</details>`;
  }).join("") || `<p class="empty">Asnjë layer nuk përputhet me kërkimin.</p>`;
  document.getElementById("lista").innerHTML = html;
  document.querySelectorAll("details").forEach(d => {
    const g = d.querySelector(".grp"), rows = d.querySelectorAll(".row input:not(:disabled)");
    const n = [...rows].filter(r => r.checked).length;
    g.indeterminate = n > 0 && n < rows.length;
  });
  side();
}

function side() {
  document.getElementById("cnt").textContent = sel.size;
  document.getElementById("mcnt").textContent = sel.size;
  const ls = [...sel].map(id => byId[id]);
  document.getElementById("chips").innerHTML = ls.length
    ? ls.map(l => `<span class="chip">${esc(l.titulli)} <b data-x="${esc(l.id)}" title="Hiqe">✕</b></span>`).join("")
    : `<span class="empty">Zgjidh layerat me tik në listë.</span>`;
  const crs = new Set(ls.map(l => l.epsg ? "EPSG:" + l.epsg : l.crs));
  const w = [];
  if (crs.size > 1) w.push(`Layerat janë në ${crs.size} sisteme koordinative (${[...crs].join(", ")}). Do t'i ripozicionoj të gjitha në KOSOVAREF01 (EPSG:9141).`);
  const pa = ls.filter(l => l.statusi === "pa .prj");
  if (pa.length) w.push(`Pa .prj: ${pa.map(l => l.titulli).join(", ")}.`);
  document.getElementById("paralajm").innerHTML = w.map(x => `<div class="note">${esc(x)}</div>`).join("");
}

function kerkesa() {
  const ls = [...sel].map(id => byId[id]);
  const d = document.querySelector("input[name=d]:checked").value;
  const lines = [
    `Detyra: ${d}`,
    `Rezultati: ${document.getElementById("rez").value}`,
    `Dosja: ${K.dosja}`,
    `Layerat (${ls.length}):`,
    ...ls.map(l => `- ${l.titulli} | ${l.fajlli} | ${l.lloji === "raster" ? "raster" : geomSq(l.gjeometria) + ", " + l.objekte + " obj."} | ${l.epsg ? "EPSG:" + l.epsg : l.crs}`),
  ];
  const p = document.getElementById("pershk").value.trim();
  if (p) lines.push(`Përshkrimi: ${p}`);
  return lines.join("\n");
}

document.getElementById("lista").addEventListener("click", e => {
  const g = e.target.closest(".grp");
  if (g) {
    e.stopPropagation();
    const d = g.closest("details");
    const ids = [...d.querySelectorAll(".row")].filter(r => !r.querySelector("input").disabled).map(r => r.dataset.id);
    const all = ids.every(id => sel.has(id));
    ids.forEach(id => all ? sel.delete(id) : sel.add(id));
    d.open = true; save(); render(); return;
  }
  const r = e.target.closest(".row");
  if (!r || r.querySelector("input").disabled) return;
  if (e.target.tagName !== "INPUT") e.preventDefault();
  sel.has(r.dataset.id) ? sel.delete(r.dataset.id) : sel.add(r.dataset.id);
  save(); render();
});
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.dataset.x) { sel.delete(e.target.dataset.x); save(); render(); }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("ft").addEventListener("change", render);
document.getElementById("mshko").onclick = () => document.getElementById("zgjedhja").scrollIntoView();
document.getElementById("pastro").onclick = () => { sel.clear(); save(); render(); };
document.getElementById("hap").onclick = () => {
  const ds = document.querySelectorAll("details"), all = [...ds].every(d => d.open);
  ds.forEach(d => d.open = !all);
};
document.getElementById("kopjo").onclick = async () => {
  const ok = document.getElementById("ok"), out = document.getElementById("out");
  if (!sel.size) { ok.textContent = "Zgjidh të paktën një layer."; return; }
  const t = kerkesa();
  out.value = t;
  try { await navigator.clipboard.writeText(t); ok.textContent = "U kopjua – ngjite (Ctrl+V) në bisedë me Claude."; out.style.display = "none"; }
  catch (err) { out.style.display = "block"; out.select(); ok.textContent = "Kopjoje tekstin më poshtë (Ctrl+C)."; }
};
render();
</script>
</body></html>
