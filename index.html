<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlasi GIS – Besart Bajrami</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#2a313c;--tx:#e6edf3;--mut:#8b949e;--acc:#d4a43a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:56px 24px 28px;max-width:1100px;margin:auto}
h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.5px}h1 span{color:var(--acc)}
.sub{color:var(--mut);margin-top:8px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img,.card video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;display:block}
.card .b{padding:14px 16px}.card h3{margin:0 0 4px;font-size:17px}
.meta{color:var(--mut);font-size:13px}.card p{margin:8px 0 0;font-size:14px;color:#c9d1d9}
.card a{color:var(--acc);font-size:14px;text-decoration:none}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:60px 0;border:1px dashed var(--line);border-radius:12px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
<h1>Atlasi <span>GIS</span></h1>
<div class="sub">MSc. Besart Bajrami, GIS Specialist · Harta, analiza hapësinore dhe video · Kosovë / Drenas</div>
<nav id="f"></nav>
</header>
<main id="g"></main>
<footer>© Besart Bajrami · Punimet përditësohen nga <code>punimet.json</code></footer>
<script>
const L={te_gjitha:"Të gjitha",harta:"Harta",analiza:"Analiza",video:"Video"};
let D=[],k="te_gjitha";
const f=document.getElementById("f"),g=document.getElementById("g");
function nav(){f.innerHTML="";for(const x in L){const b=document.createElement("button");b.textContent=L[x];if(x===k)b.className="on";b.onclick=()=>{k=x;nav();show()};f.appendChild(b)}}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function show(){
 const r=D.filter(d=>k==="te_gjitha"||d.lloji===k).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
 if(!r.length){g.innerHTML='<div class="empty">Punimet e para po vijnë së shpejti.</div>';return}
 g.innerHTML=r.map(d=>{
  const m=d.lloji==="video"?`<video src="${esc(d.fajlli)}" ${d.kopertina?`poster="${esc(d.kopertina)}"`:""} controls preload="metadata" playsinline></video>`
   :`<a href="${esc(d.fajlli)}" target="_blank"><img src="${esc(d.kopertina||d.fajlli)}" alt="${esc(d.titulli)}" loading="lazy"></a>`;
  return `<div class="card">${m}<div class="b"><h3>${esc(d.titulli)}</h3><div class="meta">${esc(L[d.lloji]||d.lloji)} · ${esc(d.data)}</div>${d.pershkrimi?`<p>${esc(d.pershkrimi)}</p>`:""}${d.shkarko?`<p><a href="${esc(d.shkarko)}">Shkarko të dhënat ↓</a></p>`:""}</div></div>`}).join("");
}
nav();
fetch("punimet.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{D=j;show()}).catch(()=>show());
</script>
</body>
</html>
